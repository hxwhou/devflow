<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大转盘抽奖</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>大转盘抽奖</h1>
  </header>

  <main class="app-main">
    <section class="wheel-stage" aria-label="抽奖转盘">
      <canvas id="wheel" width="400" height="400" aria-label="转盘"></canvas>
      <div class="pointer" aria-hidden="true"></div>
      <button id="spin" class="spin-btn" type="button">开始抽奖</button>

      <div id="result" class="modal hidden" role="dialog" aria-modal="true" aria-live="polite">
        <div class="modal-card">
          <p class="modal-label">恭喜中奖</p>
          <p id="result-text" class="result-text"></p>
          <div class="modal-actions">
            <button id="result-again" type="button">再抽一次</button>
            <button id="result-close" type="button">关闭</button>
          </div>
        </div>
      </div>
    </section>

    <section class="panel edit-panel" aria-label="奖品编辑">
      <h2 class="panel-title">奖品设置</h2>
      <ul id="prize-list" class="prize-list"></ul>
      <div class="edit-actions">
        <button id="add-prize" type="button">添加奖品</button>
        <button id="reset-default" type="button">恢复默认</button>
      </div>
    </section>

    <section class="panel history-panel" aria-label="抽奖历史">
      <h2 class="panel-title">
        抽奖历史
        <button id="clear-history" class="clear-btn" type="button">清空</button>
      </h2>
      <ol id="history-list" class="history-list"></ol>
      <p id="history-empty" class="empty-hint">暂无历史</p>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
